name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支上连续 push 时，取消还在跑的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.15 是下限：npm test 用到 --experimental-transform-types（≥22.7）
        # 和 scripts/ts-extension-hook.mjs 里的 node:module registerHooks（≥22.15）。
        node-version: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # 构建不需要任何 API Key，纯前端产物
      - run: npm run build
